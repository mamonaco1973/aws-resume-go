{{define "content"}}
<div class="max-w-md mx-auto mt-10">
  <div class="bg-white border border-gray-200 rounded-lg p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Sign In</h1>

    {{if .Error}}
    <div class="bg-red-50 border border-red-300 rounded p-3 text-sm text-red-700 mb-5">
      {{.Error}}
    </div>
    {{end}}

    <form method="post" action="/signin" class="space-y-4">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" autofocus autocomplete="email"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" autocomplete="current-password"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>

      <button type="submit"
              class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 font-medium cursor-pointer">
        Sign In
      </button>
    </form>

    <div class="mt-5 text-center text-sm text-gray-600 space-y-2">
      <a href="/signup" class="text-indigo-600 hover:underline block">Create an account</a>
    </div>
  </div>
</div>
{{end}}
