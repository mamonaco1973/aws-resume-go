{{define "content"}}
<div class="max-w-3xl">
  <div class="mb-4">
    <a href="/resumes" class="text-indigo-600 hover:underline text-sm">← My Resumes</a>
  </div>

  <h1 class="text-2xl font-bold text-gray-800 mb-6">{{.Resume.Name}}</h1>

  <div class="bg-white border border-gray-200 rounded-lg p-6">
    <h2 class="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-3">Resume Text</h2>
    <p class="text-xs text-gray-400 mb-3">{{numFmt (len .Resume.ContentText)}} characters</p>
    <pre class="whitespace-pre-wrap text-sm text-gray-700 bg-gray-50 border border-gray-200 rounded p-4 overflow-auto max-h-[32rem]">{{.Resume.ContentText}}</pre>
  </div>
</div>
{{end}}
